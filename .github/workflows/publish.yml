# Publishes to PyPI when a version tag (v*) is pushed, through PyPI trusted publishing: no API token is stored
# anywhere (robot_msgs' pattern). One-time setup on pypi.org: a "pending publisher" for project robot-models, owner
# zacharyyamaoka, repository robot_models, workflow publish.yml, environment pypi.
name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # WHY the two ruler files are left out: they read CAD bundles from a local, unpublished cache (see test.yml).
      - run: >-
          uv run --isolated --no-sources --extra test python -m pytest -q -p no:cacheprovider
          --ignore=tests/test_fit_ruler.py --ignore=tests/test_stop_ruler.py
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish --trusted-publishing always
