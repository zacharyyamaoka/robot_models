[build-system]
# WHY >=1.27: the first hatchling that writes PEP 639 metadata (an SPDX `license` string plus `license-files`).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robot-models-lib"
version = "0.3.0"
description = "Generic physical models of robot part types (no maker, no SKU): each type a ladder of models from ideal to learned, every rung with its parameters, equation and references."
readme = "README.md"
authors = [{ name = "Zach Yamaoka" }]
# WHY no "License ::" classifier: PEP 639 forbids one beside an SPDX `license` expression.
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "robotics",
    "physical-models",
    "system-identification",
    "friction",
    "actuators",
    "sensors",
    "digital-twin",
    "sim2real",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
# WHY robot_msgs + numpy only (Robot Models Layering decision, 2026-11-12; "dependency-free runtime
# cores"): the models and the pure fits must import with nothing heavier. Mesh contact is an extra.
# WHY >=0.3.0: robot_models.homing.protocols imports robot_msgs.control, first released in 0.3.0 (2026-11-17).
dependencies = ["robot-msgs>=0.3.0", "numpy>=1.26"]

[project.optional-dependencies]
# WHY coal (the hpp-fcl successor) and trimesh: the exact-mesh first contact of the kinematic homing
# rung. The ruler was frozen on 3.0.2, the version bam_pick_worlds locks through pin 3.8.0 (the test
# extra keeps it). WHY the contact extra allows 3.0.x (2026-11-12, the homing bench): coal 3.0.2's
# wheels hold numpy at 2.3.5, so sim2real (numpy 2.5.4) could not take this extra without moving its
# whole lock; 3.0.3 is the same API on numpy 2.5, and sim2real's bench re-checks the ruler's angles on it.
contact = ["coal>=3.0.2,<3.1", "trimesh>=4.0"]
test = ["pytest>=8", "coal==3.0.2", "trimesh>=4.0"]

[project.urls]
Homepage = "https://github.com/zacharyyamaoka/robot_models"
Repository = "https://github.com/zacharyyamaoka/robot_models"
Issues = "https://github.com/zacharyyamaoka/robot_models/issues"

[tool.uv.sources]
# WHY absolute (2026-11-12): a consumer's lock (sim2real) took this source over and wrote it relative to wherever it was locked
# (a worktree's "../../robot_msgs" resolved to /home/robot_msgs from the main checkout); sim2real names it absolutely too.
robot-msgs = { path = "/home/bam/robot_msgs", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/robot_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ruler: acceptance tests frozen before the code they judge (docs/peps/0001)",
]

[tool.ruff]
line-length = 110
