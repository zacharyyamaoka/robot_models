[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-models"
version = "0.1.0"
description = "Physical models and parameters of robot parts, the twin of robot_msgs: types, models, parameters and pure fits."
readme = "README.md"
authors = [{ name = "Zach Yamaoka" }]
requires-python = ">=3.11"
# WHY robot_msgs + numpy only (Robot Models Layering decision, 2026-11-12; "dependency-free runtime
# cores"): the models and the pure fits must import with nothing heavier. Mesh contact is an extra.
dependencies = ["robot-msgs>=0.2.0", "numpy>=1.26"]

[project.optional-dependencies]
# WHY coal (the hpp-fcl successor) and trimesh: the exact-mesh first contact of the kinematic homing
# rung. coal is pinned to the version bam_pick_worlds already locks through pin 3.8.0.
contact = ["coal==3.0.2", "trimesh>=4.0"]
test = ["pytest>=8", "coal==3.0.2", "trimesh>=4.0"]

[tool.uv.sources]
robot-msgs = { path = "../robot_msgs", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/robot_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ruler: acceptance tests frozen before the code they judge (docs/peps/0001)",
]

[tool.ruff]
line-length = 110
