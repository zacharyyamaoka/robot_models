<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="babble-shell" content="deck">
<title>Babble deck</title>
<style id="br-base">
/* Babble deck kit — calm base (ported from the general babble-report kit v4, 2026-10-25).
   WHY: Zach wants Notion/Obsidian calm (2026-10-03): one quiet sans, whitespace,
   colour only for exceptions. The prototypes keep Claude's dark chrome; the report
   around them stays light and quiet so the variants are the loudest thing on screen. */
:root {
  --bg: #ffffff;
  --bg-soft: #f7f7f5;
  --bg-hover: #f1f1ef;
  --ink: #37352f;
  --ink-2: #6b6a66;
  --ink-3: #9b9a97;
  --line: #ebebea;
  --line-2: #dededc;
  --accent: #2383e2;
  --accent-soft: #e8f2fc;
  --pick: #2383e2;
  --keep: #0f7b6c;
  --keep-soft: #e6f3f1;
  --drop: #9b9a97;
  --warn: #c4554d;
  --ai: #6f5fd3;
  --ai-soft: #f4f2fc;
  --stage: #191918;
  --stage-2: #232322;
  --radius: 8px;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.005em; }
.br-muted { color: var(--ink-2); }
.br-faint { color: var(--ink-3); }
.br-small { font-size: 12.5px; }

/* buttons: quiet by default, one primary at a time */
.br-btn { appearance: none; border: 1px solid var(--line-2); background: var(--bg); border-radius: 6px; padding: 5px 11px; cursor: pointer; line-height: 1.35; white-space: nowrap; }
.br-btn:hover:not(:disabled) { background: var(--bg-hover); }
.br-btn:disabled { opacity: .4; cursor: default; }
.br-btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.br-btn.primary:hover:not(:disabled) { background: #000; }
.br-btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.br-btn.ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--ink); }
.br-btn.sm { padding: 3px 9px; font-size: 13px; }
.br-btn.on { background: var(--accent-soft); border-color: #b9d6f5; color: #0b5cad; }
.br-link { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(35,131,226,.35); }
.br-kbd { font: 11px/1 var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--ink-2); background: var(--bg); }
.br-vtag { display: inline-block; font: 600 11px/1 var(--sans); letter-spacing: .02em; color: var(--ink-2); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; vertical-align: 1px; }
.br-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* chips (step chips, part chips) */
.br-chip { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.br-chip:hover { background: var(--bg-hover); color: var(--ink); }
.br-chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.br-chip.kept { background: var(--keep-soft); border-color: #b7dcd5; color: var(--keep); }

/* criteria line + brief */
.br-criteria { font-size: 12.5px; color: var(--ink); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
.br-crit b { font-weight: 600; color: var(--ink-2); font-size: 11.5px; }
.br-dot { color: var(--ink-3); }
.br-brief { max-width: 640px; font-size: 13.5px; }
.br-brief p { margin: 0 0 10px; }
.br-brief h4 { font-size: 12px; text-transform: none; color: var(--ink-2); margin: 14px 0 6px; font-weight: 600; }
.br-list { margin: 0; padding-left: 18px; }
.br-list li { margin: 2px 0; }
.br-crit-table { border-collapse: collapse; width: 100%; }
.br-crit-table td { padding: 5px 8px 5px 0; vertical-align: top; border-top: 1px solid var(--line); }
.br-crit-table td.w { width: 44px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* disclosure: two levels max */
details.br-disc > summary { cursor: pointer; color: var(--ink-2); list-style: none; padding: 4px 0; user-select: none; }
details.br-disc > summary::-webkit-details-marker { display: none; }
details.br-disc > summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; color: var(--ink-3); }
details.br-disc[open] > summary::before { transform: rotate(90deg); }
details.br-disc > summary:hover { color: var(--ink); }

/* stepper */
.br-stepper .br-step-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.br-step-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.br-step-cap { font-size: 13px; color: var(--ink-2); margin-top: 6px; min-height: 20px; }
.br-step-cap b { color: var(--ink); font-weight: 600; }
.br-stepper.mixed .br-chip.on { background: var(--bg); color: var(--ink); border-color: var(--ink-3); border-style: dashed; }

/* AI view: violet hairline marks "ought" (judgment), everything else is "is" */
.br-ai { border-left: 2px solid var(--ai); padding: 2px 0 2px 14px; }
.br-ai.locked { border-left-color: var(--line-2); }
.br-ai-locked { color: var(--ink-2); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.br-ai-kicker { font-size: 11.5px; color: var(--ai); font-weight: 600; letter-spacing: .01em; margin-bottom: 2px; }
.br-ai-head { margin: 0 0 4px; }
.br-ai-agree { margin: 0 0 4px; }
.br-ai-line { margin: 0 0 4px; color: var(--ink); max-width: 760px; }
.br-matrix table { border-collapse: collapse; font-size: 12.5px; margin: 8px 0 6px; }
.br-matrix th { font-weight: 500; color: var(--ink-2); text-align: center; padding: 4px 8px; border-bottom: 1px solid var(--line); max-width: 110px; }
.br-matrix td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
.br-matrix td.n { text-align: left; white-space: nowrap; }
.br-matrix td.s { cursor: pointer; border-radius: 4px; }
.br-matrix td.s:hover { background: var(--ai-soft); }
.br-matrix td.s.conf-low { color: var(--ink-3); }
.br-matrix td.tot { font-weight: 600; }
.br-evidence { font-size: 12.5px; max-width: 760px; min-height: 18px; }

/* decision box */
.br-decision { display: grid; gap: 8px; }
.br-summary { font-size: 13px; color: var(--ink-2); }
.br-direction { width: 100%; resize: vertical; font: 14px/1.45 var(--sans); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; background: var(--bg); }
.br-direction:focus { outline: 2px solid var(--accent-soft); border-color: #9cc4ee; }

.br-toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px); background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 13px; opacity: 0; pointer-events: none; transition: .18s; z-index: 1000; }
.br-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* a quiet popover used for "Brief" */
.br-pop { position: absolute; z-index: 50; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(15,15,15,.12), 0 2px 6px rgba(15,15,15,.06); padding: 16px 18px; max-height: 76vh; overflow: auto; }

/* ---- exhibits: any kind, any scale ---- */
.bx { position: relative; overflow: hidden; flex: none; background: var(--bg-soft); border-radius: 6px; }
.bx[data-kind="live"], .bx[data-kind="video"], .bx[data-kind="html"] { background: #fff; }
.bx-html { display: block; }
.bx-html.poster { pointer-events: none; }
/* a cropped poster fades out at the bottom: there is more, one click away */
.bx.cropped::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; z-index: 2; pointer-events: none; background: linear-gradient(rgba(255,255,255,0), #fff); }
.bx-in { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.bx-in > img, .bx-in > video, .bx-in > iframe { display: block; border: 0; max-width: none; }
.bx-ann { position: absolute; left: 0; top: 0; z-index: 3; }
html.br-annotating .bx-ann { cursor: crosshair; background: rgba(35,131,226,.03); outline: 1px dashed rgba(35,131,226,.35); outline-offset: -1px; }
.bx-pin { position: absolute; width: 0; height: 0; z-index: 2; cursor: pointer; }
.bx-pin .bx-num { position: absolute; left: -11px; top: -11px; }
.bx-box { position: absolute; border: 2px solid var(--accent); border-radius: 3px; background: rgba(35,131,226,.08); cursor: pointer; }
.bx-box .bx-num { position: absolute; left: -11px; top: -11px; }
.bx-box.ghost { border-style: dashed; pointer-events: none; }
.bx-num { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--accent); color: #fff; font: 600 12px/1 var(--sans); box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.25); }
/* Pins live in .bx-ann, a sibling of the scaled .bx-in, so they stay one size at any exhibit scale. */
.bx-num.static { position: static; box-shadow: none; }
.bx-note { position: absolute; z-index: 1001; display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; box-shadow: 0 10px 30px rgba(15,15,15,.14); width: 330px; }
.bx-note-n { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff; font: 600 11px/1 var(--sans); }
.bx-note-in { flex: 1; border: 0; outline: 0; font: 13.5px/1.4 var(--sans); color: var(--ink); background: transparent; }
.br-ann-row { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
.br-ann-text { appearance: none; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); cursor: pointer; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-ann-text:hover { color: var(--accent); }
.br-x { appearance: none; border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }
.br-x:hover { color: var(--warn); }

.br-error { white-space: pre-wrap; color: var(--warn); padding: 20px; }
</style>
<script id="br-preview-css">window.BR_PREVIEW_CSS = "\n    :root {\n      --paper: #f4f0e8;\n      --paper-deep: #ebe5da;\n      --panel: #fffdf9;\n      --ink: #20201f;\n      --muted: #6e6a63;\n      --line: #d8d0c4;\n      --line-strong: #bdb3a5;\n      --soft: #f8f5ef;\n      --green: #2f7f62;\n      --red: #b84939;\n      --blue: #3f6fa8;\n      --shadow: 0 18px 60px rgba(53, 46, 36, 0.10);\n      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;\n      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      --serif: Iowan Old Style, Baskerville, Georgia, serif;\n    }\n\n    * { box-sizing: border-box; }\n\n    html {\n      scroll-behavior: smooth;\n      background: var(--paper);\n    }\n\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(circle at 15% -10%, rgba(224, 90, 63, 0.09), transparent 32rem),\n        radial-gradient(circle at 95% 5%, rgba(47, 127, 116, 0.08), transparent 30rem),\n        var(--paper);\n      font-family: var(--sans);\n      line-height: 1.5;\n    }\n\n    button,\n    textarea,\n    input {\n      font: inherit;\n    }\n\n    button {\n      color: inherit;\n    }\n\n    a {\n      color: inherit;\n    }\n\n    .page {\n      width: min(1600px, calc(100% - 24px));\n      margin: 0 auto;\n    }\n\n    .hero {\n      padding: 34px 0 22px;\n      border-bottom: 1px solid var(--line);\n    }\n\n    .hero-grid {\n      display: block;\n    }\n\n    .kicker,\n    .eyebrow {\n      color: var(--muted);\n      font: 700 11px/1.2 var(--mono);\n      letter-spacing: 0.12em;\n      text-transform: uppercase;\n    }\n\n    h1 {\n      max-width: 1100px;\n      margin: 10px 0 12px;\n      font: 500 clamp(38px, 5vw, 68px)/0.98 var(--serif);\n      letter-spacing: -0.045em;\n    }\n\n    .brief {\n      max-width: 980px;\n      margin: 0;\n      color: #494641;\n      font-size: clamp(15px, 1.45vw, 19px);\n      line-height: 1.48;\n    }\n\n    .hero-aside {\n      border-left: 1px solid var(--line-strong);\n      padding-left: 24px;\n    }\n\n    .hero-aside strong {\n      display: block;\n      margin: 7px 0 9px;\n      font: 500 21px/1.25 var(--serif);\n    }\n\n    .hero-aside p {\n      margin: 0;\n      color: var(--muted);\n      font-size: 13px;\n    }\n\n    .badge-row {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 8px;\n      margin-top: 16px;\n    }\n\n    .badge {\n      display: inline-flex;\n      align-items: center;\n      min-height: 29px;\n      padding: 5px 10px;\n      border: 1px solid var(--line);\n      border-radius: 99px;\n      background: rgba(255, 253, 249, 0.62);\n      color: #4d4943;\n      font: 650 11px/1 var(--mono);\n    }\n\n    .badge.primary {\n      border-color: #222;\n      background: #222;\n      color: white;\n    }\n\n    .workflow {\n      display: grid;\n      grid-template-columns: repeat(5, 1fr);\n      margin: 30px 0 0;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 249, 0.52);\n    }\n\n    .workflow-step {\n      min-height: 92px;\n      padding: 15px 17px;\n      border-right: 1px solid var(--line);\n    }\n\n    .workflow-step:last-child {\n      border-right: 0;\n    }\n\n    .workflow-step span {\n      color: var(--muted);\n      font: 700 10px/1 var(--mono);\n      letter-spacing: 0.1em;\n    }\n\n    .workflow-step b {\n      display: block;\n      margin: 9px 0 3px;\n      font: 600 15px/1.2 var(--sans);\n    }\n\n    .workflow-step small {\n      color: var(--muted);\n      font-size: 12px;\n    }\n\n    .context {\n      display: grid;\n      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.72fr);\n      gap: 22px;\n      padding: 28px 0 32px;\n    }\n\n    .context-panel {\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 249, 0.72);\n      padding: 18px;\n    }\n\n    .context-panel h2 {\n      margin: 7px 0 13px;\n      font: 500 24px/1.2 var(--serif);\n    }\n\n    .axis-list {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 9px;\n    }\n\n    .axis {\n      min-width: min(100%, 260px);\n      flex: 1 1 260px;\n      padding: 11px 12px;\n      border: 1px solid var(--line);\n      background: var(--panel);\n    }\n\n    .axis b {\n      display: block;\n      margin-bottom: 5px;\n      font-size: 12px;\n    }\n\n    .axis span {\n      color: var(--muted);\n      font-size: 12px;\n    }\n\n    .invariant-list {\n      display: grid;\n      gap: 9px;\n      margin: 0;\n      padding: 0;\n      list-style: none;\n    }\n\n    .invariant-list li {\n      position: relative;\n      padding-left: 21px;\n      color: #4b4842;\n      font-size: 13px;\n    }\n\n    .invariant-list li::before {\n      position: absolute;\n      left: 0;\n      top: 0.2em;\n      color: var(--green);\n      content: \"◆\";\n      font-size: 9px;\n    }\n\n    .boundary {\n      margin-top: 15px;\n      padding-top: 13px;\n      border-top: 1px solid var(--line);\n      color: var(--muted);\n      font-size: 12px;\n    }\n\n    .boundary b {\n      color: var(--ink);\n    }\n\n    .objective-contract {\n      display: grid;\n      gap: 13px;\n      padding: 20px 0 24px;\n    }\n\n    .objective-head {\n      display: flex;\n      align-items: end;\n      justify-content: space-between;\n      gap: 18px;\n    }\n\n    .objective-head h2 {\n      margin: 5px 0 0;\n      font: 500 clamp(24px, 2.7vw, 34px)/1.05 var(--serif);\n    }\n\n    .objective-head p {\n      max-width: 520px;\n      margin: 0;\n      color: var(--muted);\n      font-size: 12px;\n      text-align: right;\n    }\n\n    .objective-grid {\n      display: grid;\n      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);\n      gap: 12px;\n    }\n\n    .objective-panel {\n      padding: 13px;\n      border: 1px solid var(--line);\n      background: rgba(255, 253, 249, 0.76);\n    }\n\n    .objective-panel-head {\n      display: flex;\n      align-items: center;\n control {\n      opacity: 0.4;\n      pointer-events: none;\n    }\n\n    /* WHY: a real multi-column overview — \"Grid\" used to mean the same single column as\n       \"Focus\" with nothing hidden, which is why nothing could be seen at a glance and the\n       page never used a widened window. --card-min is the density control (see the\n       toolbar slider); auto-fit lets a small variant count stretch to fill the row instead\n       of leaving dead space. */\n    .variant-grid {\n      display: grid;\n      grid-template-columns: repeat(auto-fit, minmax(var(--card-min, 460px), 1fr));\n      gap: 22px;\n      padding: 24px 0 32px;\n    }\n\n    .variant-grid.focus-layout {\n      grid-template-columns: minmax(0, 1fr);\n      justify-content: stretch;\n    }\n\n    .variant-grid.focus-layout .variant-card:not(.is-focused) {\n      display: none;\n    }\n\n    /* Grid: compact, scannable cards — click a header to zoom into Focus for the real size.\n       Focus: one card gets nearly the whole viewport, because it is the only thing on screen. */\n    .variant-grid:not(.focus-layout) .prototype-frame {\n      min-height: 220px;\n      max-height: 340px;\n    }\n\n    .variant-grid.focus-layout .prototype-frame {\n      max-height: min(90vh, 1400px);\n    }\n\n    .variant-grid:not(.focus-layout) .variant-header {\n      cursor: zoom-in;\n    }\n\n    .variant-grid:not(.focus-layout) .variant-header:hover .variant-title h3 {\n      color: var(--accent);\n    }\n\n    .variant-card {\n      --accent: #222;\n      position: relative;\n      min-width: 0;\n      overflow: visible;\n      border: 1px solid var(--line-strong);\n      border-top: 5px solid var(--accent);\n      border-radius: 7px;\n      background: var(--panel);\n      box-shadow: 0 3px 12px rgba(52, 45, 36, 0.04);\n      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;\n    }\n\n    .variant-card:hover,\n    .variant-card.is-focused {\n      border-color: color-mix(in srgb \n      .queue-body {\n        grid-template-columns: 1fr;\n      }\n\n      .queue-list {\n        display: none;\n      }\n\n      .evidence-options,\n      .test-recipe {\n        grid-template-columns: 1fr;\n      }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      * {\n        scroll-behavior: auto !important;\n        transition: none !important;\n      }\n\n      .prototype .story-target {\n        animation: none !important;\n      }\n    }\n\n    @media print {\n      .gallery-head,\n      .decision-dock,\n      .variant-actions,\n      .variant-feedback,\n      .variant-note,\n      .keep-list,\n      .demo-button,\n      .story-driver {\n        display: none !important;\n      }\n\n      .variant-grid {\n        grid-template-columns: 1fr;\n      }\n\n      .variant-card {\n        break-inside: avoid;\n        box-shadow: none;\n      }\n    }\n  ";</script>
<style>
  /* Deck shell — the format Zach's 2026-10-25 report round recommended: F2 Deck as the shell
     (a grid of every hero, then one exhibit on a full stage, ↑/↓ flips variants at the same
     exhibit and step) with a Split button on the stage that turns it into F4 Side by side's
     two live panes with swipe / onion / flip.
     WHY: Zach looks first (2026-10-03) — the page opens on every hero nearly alone; the deck
     is one click away and flips variants in place, like a blink comparator; side by side
     with it clear what belongs to what (2026-09-21) is one more click.
     2026-11-17: the report round's recommended "Splice" (d6) is ported in — flips land on the step with
     the same label, Diff (X) in Split and Splice, and Splice (⇧M) writes a per-decision recipe. The
     first screen is unchanged. */
  body { min-height: 100vh; }
  body.in-deck { overflow: hidden; }
  .top { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; position: relative; z-index: 20; }
  .top .title { font-weight: 600; min-width: 120px; overflow: hidden; text-overflow: ellipsis; flex: 0 4 auto; }
  .top .sp { flex: 1 1 0; min-width: 6px; }
  .top .sep { width: 1px; height: 18px; background: var(--line); flex: none; }
  .top .br-btn { flex: none; }
  .top .count { color: var(--ink-3); font-size: 12.5px; flex: none; }
  .tabs { display: flex; gap: 2px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
  .tab { appearance: none; border: 0; background: none; padding: 4px 9px; border-radius: 6px; color: var(--ink-2); cursor: pointer; font-size: 13px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; flex: none; }
  .tab:hover { background: var(--bg-hover); color: var(--ink); }
  .tab.on { background: var(--bg-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
  .tab.none { color: var(--ink-3); }
  .top .br-stepper { flex: none; }
  .top .br-stepper .br-chip { padding: 2px 8px; }
  .size { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12.5px; flex: none; }
  .size input { width: 110px; accent-color: var(--ink-2); }

  /* overview grid */
  .ov { padding: 18px 24px 56px; }
  .grid { display: grid; gap: 14px 14px; justify-content: center; align-items: start; }
  .cell { display: grid; gap: 7px; justify-items: center; align-content: start; padding: 6px; border-radius: 10px; cursor: pointer; outline: none; }
  .cell:hover { background: var(--bg-soft); }
  .grid.kbd .cell.focus { box-shadow: inset 0 0 0 1px var(--line-2); }
  .cell .box { display: flex; align-items: center; justify-content: center; }
  .cell .box.fluid { align-items: flex-start; }
  .cell .bx, .stage .bx { box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(15,15,15,.05); }
  .cell.drop .box { opacity: .38; }
  .cap { font-size: 13px; display: flex; gap: 6px; align-items: center; max-width: 100%; min-width: 0; }
  .cap .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glyph { font-size: 12px; color: var(--ink-2); flex: none; }
  .glyph.pick { color: var(--pick); }
  .glyph.keep { color: var(--keep); }

  /* deck */
  .deck { height: calc(100vh - 48px); display: flex; flex-direction: column; }
  .vline { flex: none; height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 20px; white-space: nowrap; }
  .vline .nm { font-weight: 600; flex: none; }
  .vline .th { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
  .vline .sp { flex: 1 1 auto; }
  .tri { display: flex; gap: 2px; flex: none; }
  .tri button { appearance: none; border: 0; background: none; color: var(--ink-2); padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tri button:hover { background: var(--bg-hover); color: var(--ink); }
  .tri button.on { background: var(--bg-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
  .tri button.on.pick { color: var(--pick); box-shadow: inset 0 0 0 1px #b9d6f5; background: var(--accent-soft); }
  .tri button.on.keep { color: var(--keep); box-shadow: inset 0 0 0 1px #b7dcd5; background: var(--keep-soft); }
  .stage { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; background: var(--bg-soft); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; }
  .stage.split { overflow: hidden; padding: 10px 14px; }
  .holder { margin: auto; padding: 14px; position: relative; }
  .holder > .bx.hidden { display: none; }
  .empty { margin: auto; color: var(--ink-3); text-align: center; padding: 40px; }
  .capline { flex: none; min-height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 20px; white-space: nowrap; font-size: 13px; }
  .capline .lab { font-weight: 600; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  .capline .cpt { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; cursor: pointer; }
  .capline.open { white-space: normal; align-items: flex-start; padding-top: 7px; padding-bottom: 7px; }
  .capline.open .lab { white-space: nowrap; }
  .capline .pos { color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; }
  .seg { display: flex; flex: none; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
  .seg button { appearance: none; border: 0; background: var(--bg); padding: 2px 9px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button:hover { background: var(--bg-hover); color: var(--ink); }
  .seg button.on { background: var(--bg-soft); color: var(--ink); }
  /* filmstrip: every variant's poster for the current slot */
  .film { flex: none; height: 100px; display: flex; gap: 10px; align-items: flex-start; padding: 10px 20px 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .film-inner { display: flex; gap: 10px; margin: 0 auto; }
  .th-cell { display: grid; gap: 4px; justify-items: center; cursor: pointer; flex: none; }
  .th-img { position: relative; height: 60px; border-radius: 5px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; }
  .th-img.fluid { align-items: flex-start; }
  .th-img .bx { border-radius: 0; }
  .th-img .bx.cropped::after { height: 18px; }
  .th-img .bx-ann { display: none; }   /* a thumbnail counts its notes (.th-notes) instead of drawing full-size pins */
  .th-cell.cur .th-img { box-shadow: 0 0 0 2px var(--ink); }
  .th-cell:hover .th-img { box-shadow: 0 0 0 1px var(--ink-3); }
  .th-cell.cur:hover .th-img { box-shadow: 0 0 0 2px var(--ink); }
  .th-cell.drop .th-img .bx { opacity: .35; }
  .th-cell.missing .th-img { background: repeating-linear-gradient(135deg, var(--bg-soft) 0 6px, #fff 6px 12px); }
  .th-lab { font-size: 11.5px; color: var(--ink-2); display: flex; gap: 4px; align-items: center; }
  .th-cell.cur .th-lab { color: var(--ink); font-weight: 600; }
  .th-badge { position: absolute; right: 3px; top: 3px; z-index: 4; font-size: 10.5px; line-height: 1; padding: 2px 4px; border-radius: 4px; background: rgba(255,255,255,.92); color: var(--ink-2); }
  .th-badge.pick { color: var(--pick); }
  .th-badge.keep { color: var(--keep); }
  .th-pane { position: absolute; left: 3px; top: 3px; z-index: 4; font: 600 10.5px/1 var(--sans); background: var(--ink); color: #fff; border-radius: 4px; padding: 3px 5px; }
  .th-notes { position: absolute; left: 3px; bottom: 3px; z-index: 4; font: 600 10px/1 var(--sans); color: #fff; background: var(--accent); border-radius: 8px; padding: 2px 5px; }

  /* split: two live panes (side by side) or one overlay frame (swipe / onion / flip) */
  .panes { flex: 1 1 auto; min-width: 0; display: flex; gap: 12px; }
  .pane { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
  .ph { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 10px; border-bottom: 1px solid var(--line); min-height: 37px; white-space: nowrap; }
  .ph .sp { flex: 1 1 auto; min-width: 4px; }
  .plet { font: 600 11px/1 var(--sans); color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 5px; flex: none; }
  .pick-sel { font: 600 13px var(--sans); color: var(--ink); border: 0; background: transparent; padding: 2px 0; cursor: pointer; max-width: 260px; min-width: 0; text-overflow: ellipsis; }
  .pb { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--bg-soft); scrollbar-width: thin; }
  .pc { display: flex; min-width: 100%; min-height: 100%; width: max-content; padding: 12px; }
  .pc > .bx, .pc > .ovbox { margin: auto; box-shadow: 0 0 0 1px var(--line); }
  .pc > .bx.fluidpane, .pc > .ovbox.fluidpane { margin: 0 auto auto; }
  .ovbox { position: relative; flex: none; }
  .ov-l { position: absolute; left: 0; top: 0; }
  .ov-l > .bx { border-radius: 0; }
  .tagpill { position: absolute; top: 8px; z-index: 6; pointer-events: none; font: 600 12px/1 var(--sans); background: rgba(25,25,24,.82); color: #fff; border-radius: 5px; padding: 5px 7px; }
  .tagpill.a { left: 8px; } .tagpill.b { right: 8px; }
  .handle { position: absolute; top: 0; bottom: 0; width: 18px; margin-left: -9px; z-index: 5; cursor: ew-resize; touch-action: none; }
  .handle::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .handle::after { content: "⇔"; position: absolute; left: 50%; top: 120px; transform: translate(-50%,-50%); width: 26px; height: 26px; border-radius: 13px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 13px; line-height: 26px; text-align: center; color: var(--ink); }
  .ovctl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .ovctl input[type=range] { width: 160px; accent-color: var(--ink); }

  /* Your call slide-over */
  .ycall { position: fixed; top: 48px; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--bg); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(15,15,15,.08); padding: 16px 20px 40px; overflow: auto; z-index: 950; transform: translateX(104%); transition: transform .18s ease; }
  .ycall.open { transform: none; }
  .ycall h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ycall h4 { font-size: 12.5px; color: var(--ink-2); margin: 18px 0 6px; font-weight: 600; }
  .trow { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 13px; }
  .trow .nm { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .trow .nm:hover { color: var(--accent); }
  .trow .tri button { padding: 2px 6px; font-size: 12.5px; }
  .order-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--ink-2); }

  /* details popover + keys */
  .det p { margin: 0 0 8px; }
  .det .lbl { color: var(--ink-2); font-size: 12.5px; }
  .det .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .det .chips .br-chip { white-space: normal; text-align: left; border-radius: 12px; }
  .det textarea { width: 100%; font: 13.5px/1.4 var(--sans); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 8px; resize: vertical; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; align-items: center; }
  .keys .k { display: flex; gap: 3px; justify-content: flex-end; }
  .keys .kh { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); font-weight: 600; margin-top: 6px; }

  /* ==== Splice · Diff · label-aligned steps — ported 2026-11-17 from the report round's d6 prototype
     (bam_ws docs/babble_report_deck/formats/d6_splice.html: d2 Merge + d3 Diff lens + d5's step matcher). */
  /* label-aligned steps, said quietly where two exhibits sit on different step numbers */
  .capline .al-note { color: var(--ink-3); flex: none; max-width: 46%; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .al-tag { color: var(--ink-3); font-size: 11.5px; flex: none; border: 1px dashed var(--line-2); border-radius: 4px; padding: 1px 5px; font-variant-numeric: tabular-nums; }

  /* Splice (⇧M): rail of decisions · the options on the stage · the recipe. Prior art: VS Code's 3-way
     merge editor, Kaleidoscope merge, Figma branch review. WHY: Zach splices (2026-07-19) — a round ends
     as "V2's model with V4's climb", not one pick; each decision is a hunk, each variant a side. */
  .mg-row { display: flex; height: calc(100vh - 48px); }
  .mg-row > .deck { flex: 1 1 auto; min-width: 0; height: 100%; }

C } /* Name.Variable.Magic */\n.api-repl pre.code .il { color: #666 } /* Literal.Number.Integer.Long */\n<\/style><div class=\"api-repl\" style=\"--accent:#3f7be0\"><div class=\"repl-head\"><b>round 8 · real runs · robot_metrics (torchmetrics, ported)<\/b><span>session on 252 real plays, 252 twin answers, 10 five-bar rungs<\/span><\/div><div class=\"cell-head first\"><b>1 · a part&#x27;s metrics<\/b><span>0.00 s<\/span><\/div><p class=\"caption\">A part type lists configured stock metrics beside its models; the pendulum arm adds tip aliases over the SAME bases (the lever is a display factor), the chain the same ErrorStat on its tool.<\/p><div class=\"stmt\"><pre class=\"code\"><span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">INTEGRATED_SERVO<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">())<\/span><\/pre><pre class=\"out\">integrated_servo: 6 metrics · models: IntegratedServo (14 models)\n  tracking RMS         ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0) on joint   [deg]  across runs: median\n  tracking peak        ErrorStat(statistic=&#x27;max_abs&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0) on joint   [deg]\n  stop error p90 (T4)  DwellError(statistic=&#x27;p90&#x27;, include_last_dwell=True, joint=0) on joint   [deg]\n  overshoot            Overshoot(statistic=&#x27;max&#x27;, include_last_dwell=True, joint=0) on joint   [deg]\n  lag                  TimeOffset(max_offset_s=0.25)                on command [ms]\n  limiter share        CodeShare(codes=(97, 98, 99, 102), channel=&#x27;fault&#x27;) on joint   [%]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">arm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pendulum_arm<\/span><span class=\"p\">(<\/span><span class=\"n\">tip_length_m<\/span><span class=\"o\">=<\/span><span class=\"n\">TIPS<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"can11\"<\/span><span class=\"p\">])<\/span>    <span class=\"c1\"># CAN 11: the 339 mm heavy pendulum<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">())<\/span><\/pre><pre class=\"out\">1-DOF pendulum arm (tip 339 mm): 12 metrics · models: Ladder &#x27;rigid_body_chain&#x27; (10 rungs, no ModelFamily yet)\n  tracking RMS         ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0) on joint   [deg]  across runs: median\n  tracking peak        ErrorStat(statistic=&#x27;max_abs&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0) on joint   [deg]\n  stop error p90 (T4)  DwellError(statistic=&#x27;p90&#x27;, include_last_dwell=True, joint=0) on joint   [deg]\n  overshoot            Overshoot(statistic=&#x27;max&#x27;, include_last_dwell=True, joint=0) on joint   [deg]\n  lag                  TimeOffset(max_offset_s=0.25)                on command [ms]\n  limiter share        CodeShare(codes=(97, 98, 99, 102), channel=&#x27;fault&#x27;) on joint   [%]\n  tip tracking RMS     ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0) on joint   [mm]  across runs: median\n  tip stop error       DwellError(statistic=&#x27;median&#x27;, include_last_dwell=True, joint=0) on joint   [mm]\n  tip stop worst       DwellError(statistic=&#x27;max&#x27;, include_last_dwell=True, joint=0) on joint   [mm]\n  tip settle           SettleTime(band=0.0029498525073746312, statistic=&#x27;median&#x27;, include_last_dwell=True, joint=0) on joint   [s]\n  all stops settled    AllSettled(band=0.0029498525073746312, include_last_dwell=True, joint=0) on joint   [-]\n  stops                DwellError(statistic=&#x27;count&#x27;, include_last_dwell=True, joint=0) on joint   [-]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">RIGID_BODY_CHAIN<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">())<\/span><\/pre><pre class=\"out\">rigid_body_chain (bam_fb five-bar): 4 metrics · models: Ladder &#x27;rigid_body_chain&#x27; (10 rungs, no ModelFamily yet)\n  j2 tracking RMS    ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0) on joints  [deg]\n  c1 tracking RMS    ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=1) on joints  [deg]\n  tool tracking RMS  ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0) on tool    [mm]\n  tool worst         ErrorStat(statistic=&#x27;max_abs&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0) on tool    [mm]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">aliases<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"n\">alias<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"n\">alias<\/span> <span class=\"k\">for<\/span> <span class=\"n\">alias<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">metrics<\/span><span class=\"p\">}<\/span>\n<span class=\"n\">aliases<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"tip stop error\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">card<\/span><span class=\"p\">()<\/span><\/pre><pre class=\"out\">{&#x27;name&#x27;: &#x27;tip stop error&#x27;,\n &#x27;base&#x27;: &#x27;DwellError&#x27;,\n &#x27;config&#x27;: &quot;statistic=&#x27;median&#x27;, include_last_dwell=True, joint=0&quot;,\n &#x27;unit&#x27;: &#x27;mm&#x27;,\n &#x27;signal&#x27;: &#x27;joint&#x27;,\n &#x27;across_runs&#x27;: &#x27;pool&#x27;,\n &#x27;description&#x27;: &#x27;The error left at every stop: |mean(measured - target)| over the last 50 ms of &#x27;\n                &#x27;each dwell of at least 0.25 s at zero commanded speed that a move led into; one &#x27;\n                &#x27;statistic over the pooled stops.&#x27;,\n &#x27;references&#x27;: [&#x27;bam_rack_twin acceptance T4 (stop_accuracy: dwell &gt;= 0.25 s, error = mean of the &#x27;\n                &#x27;last 50 ms)&#x27;,\n                &#x27;ISO 9283:1998 (manipulating industrial robots: performance criteria) pose &#x27;\n                &#x27;accuracy&#x27;],\n &#x27;function&#x27;: &#x27;robot_metrics.DwellError.compute&#x27;,\n &#x27;target&#x27;: None,\n &#x27;value_type&#x27;: &#x27;number&#x27;}<\/pre><\/div><div class=\"cell-head\"><b>2 · one recording, offline and live<\/b><span>0.06 s<\/span><\/div><p class=\"caption\">The same collection fed the whole recording, and fed it 7 rows at a time with a peek mid-run: identical numbers, and 12 aliases cost 5 computations (dwell metrics share one stop tracker).<\/p><div class=\"stmt\"><pre class=\"code\"><span class=\"n\">run<\/span> <span class=\"o\">=<\/span> <span class=\"n\">fixture<\/span><span class=\"o\">.<\/span><span class=\"n\">pendulum_runs<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"real\"<\/span><span class=\"p\">)[<\/span><span class=\"mi\">32<\/span><span class=\"p\">]<\/span>   <span class=\"c1\"># CAN 11, rung 0.9, a repeat<\/span>\n<span class=\"n\">recording<\/span> <span class=\"o\">=<\/span> <span class=\"n\">RunRecording<\/span><span class=\"o\">.<\/span><span class=\"n\">from_run<\/span><span class=\"p\">(<\/span><span class=\"n\">run<\/span><span class=\"p\">)<\/span><\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">offline<\/span> <span class=\"o\">=<\/span> <span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">collection<\/span><span class=\"p\">()(<\/span><span class=\"n\">recording<\/span><span class=\"p\">)<\/span>     <span class=\"c1\"># update + end_run + compute<\/span><\/pre><\/div><d C } /* Name.Variable.Magic */\n.api-repl pre.code .il { color: #666 } /* Literal.Number.Integer.Long */\n<\/style><div class=\"api-repl\" style=\"--accent:#2e9e6b\"><div class=\"repl-head\"><b>round 8 · real runs · Family metrics (IntegratedServo.metrics)<\/b><span>session on 252 real plays, 252 twin answers, 10 five-bar rungs<\/span><\/div><div class=\"cell-head first\"><b>1 · a part&#x27;s metrics<\/b><span>0.00 s<\/span><\/div><p class=\"caption\">The family IS the part type&#x27;s models; its metrics are declared beside them. The arm is the servo&#x27;s Metrics plus tip aliases; the chain&#x27;s are keyed by type id until it has a family.<\/p><div class=\"stmt\"><pre class=\"code\"><span class=\"n\">IntegratedServo<\/span>                                  <span class=\"c1\"># .models: the family itself<\/span><\/pre><pre class=\"out\">&lt;ModelFamily IntegratedServo · integrated_servo · 14 models: M0.ideal, M1.datasheet, M2.coulomb_viscous, M3.stribeck, M3.load, M3.lugre, M3.weakening_capture, M4.ripple, M4.drivetrain, M5.dcmotor, M5.envelope, M5.wear, M6.residual, M7.learned&gt;<\/pre><\/div><div class=\"stmt\"><pre class=\"code\"><span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">IntegratedServo<\/span><span class=\"o\">.<\/span><span class=\"n\">metrics<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"IntegratedServo\"<\/span><span class=\"p\">))<\/span><\/pre><pre class=\"out\">IntegratedServo.metrics: 6 aliases over 6 configured metrics\n  tracking RMS         ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0, across_runs=&#x27;median&#x27;) on joint   [deg]\n  tracking peak        ErrorStat(statistic=&#x27;max_abs&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0, across_runs=&#x27;max&#x27;) on joint   [deg]\n  stop error p90 (T4)  Dwell(quantity=&#x27;error&#x27;, statistic=&#x27;p90&#x27;, band=inf, include_last_dwell=True, joint=0) on joint   [deg]\n  overshoot            Dwell(quantity=&#x27;overshoot&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) on joint   [deg]\n  lag                  TimeOffset(max_offset_s=0.25, across_runs=&#x27;median&#x27;)                    on command [ms]\n  limiter share        CodeShare(codes=(97, 98, 99, 102), channel=&#x27;fault&#x27;)                    on joint   [%]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">arm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pendulum_arm<\/span><span class=\"p\">(<\/span><span class=\"n\">tip_length_m<\/span><span class=\"o\">=<\/span><span class=\"n\">TIPS<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"can11\"<\/span><span class=\"p\">])<\/span>    <span class=\"c1\"># CAN 11: the 339 mm heavy pendulum<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"1-DOF pendulum arm (CAN 11, 339 mm)\"<\/span><span class=\"p\">))<\/span><\/pre><pre class=\"out\">1-DOF pendulum arm (CAN 11, 339 mm).metrics: 12 aliases over 11 configured metrics\n  tracking RMS         ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0, across_runs=&#x27;median&#x27;) on joint   [deg]\n  tracking peak        ErrorStat(statistic=&#x27;max_abs&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0, across_runs=&#x27;max&#x27;) on joint   [deg]\n  stop error p90 (T4)  Dwell(quantity=&#x27;error&#x27;, statistic=&#x27;p90&#x27;, band=inf, include_last_dwell=True, joint=0) on joint   [deg]\n  overshoot            Dwell(quantity=&#x27;overshoot&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) on joint   [deg]\n  lag                  TimeOffset(max_offset_s=0.25, across_runs=&#x27;median&#x27;)                    on command [ms]\n  limiter share        CodeShare(codes=(97, 98, 99, 102), channel=&#x27;fault&#x27;)                    on joint   [%]\n  tip tracking RMS     ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0, across_runs=&#x27;median&#x27;) on joint   [mm]\n  tip stop error       Dwell(quantity=&#x27;error&#x27;, statistic=&#x27;median&#x27;, band=inf, include_last_dwell=True, joint=0) on joint   [mm]\n  tip stop worst       Dwell(quantity=&#x27;error&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) on joint   [mm]\n  tip settle           Dwell(quantity=&#x27;settle&#x27;, statistic=&#x27;median&#x27;, band=0.0029498525073746312, include_last_dwell=True, joint=0) on joint   [s]\n  all stops settled    Dwell(quantity=&#x27;settled&#x27;, statistic=&#x27;all&#x27;, band=0.0029498525073746312, include_last_dwell=True, joint=0) on joint   [-]\n  stops                Dwell(quantity=&#x27;count&#x27;, statistic=&#x27;sum&#x27;, band=inf, include_last_dwell=True, joint=0) on joint   [-]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">chain_metrics<\/span> <span class=\"o\">=<\/span> <span class=\"n\">METRICS_BY_TYPE<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"rigid_body_chain\"<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">chain_metrics<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"rigid_body_chain\"<\/span><span class=\"p\">))<\/span><\/pre><pre class=\"out\">rigid_body_chain.metrics: 4 aliases over 4 configured metrics\n  j2 tracking RMS    ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0, across_runs=&#x27;median&#x27;) on joints  [deg]\n  c1 tracking RMS    ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=1, across_runs=&#x27;median&#x27;) on joints  [deg]\n  tool tracking RMS  ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0, across_runs=&#x27;median&#x27;) on tool    [mm]\n  tool worst         ErrorStat(statistic=&#x27;max_abs&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0, across_runs=&#x27;max&#x27;) on tool    [mm]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">aliases<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"tip stop error\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">card<\/span><span class=\"p\">()<\/span><\/pre><pre class=\"out\">{&#x27;name&#x27;: &#x27;tip stop error&#x27;,\n &#x27;unit&#x27;: &#x27;mm&#x27;,\n &#x27;signal&#x27;: &#x27;joint&#x27;,\n &#x27;target&#x27;: None,\n &#x27;function&#x27;: &#x27;robot_models.metrics.Dwell.functional&#x27;,\n &#x27;base&#x27;: &#x27;Dwell&#x27;,\n &#x27;config&#x27;: &quot;quantity=&#x27;error&#x27;, statistic=&#x27;median&#x27;, band=inf, include_last_dwell=True, joint=0&quot;,\n &#x27;description&#x27;: &#x27;A quantity of every stop (a dwell &gt;= 0.25 s at zero commanded speed on one target &#x27;\n                &#x27;that a move led into), pooled over the runs: its error over the last 50 ms, its &#x27;\n                &#x27;settle time, its overshoot.&#x27;,\n &#x27;references&#x27;: [&#x27;bam_rack_twin acceptance T4 (dwell &gt;= 0.25 s, error = mean of its last 50 ms)&#x27;,\n                &#x27;MATLAB stepinfo; ROS 2 joint_trajectory_controller goal check&#x27;,\n                &#x27;ISO 9283 pose accuracy&#x27;],\n &#x27;value_type&#x27;: &#x27;number&#x27;,\n &#x27;hint&#x27;: &#x27;distribution&#x27;}<\/pre><\/div><div class=\"cell-head\"><b>2 · one recording, offline and live<\/b><span>0.02 s<\/span><\/div><p class=\"caption\">update() appends chunks and compute() runs the functional twin over the buffer, so live is offline by co C } /* Name.Variable.Magic */\n.api-repl pre.code .il { color: #666 } /* Literal.Number.Integer.Long */\n<\/style><div class=\"api-repl\" style=\"--accent:#c9822b\"><div class=\"repl-head\"><b>round 8 · real runs · Signals and aliases (robot_msgs.metrics)<\/b><span>session on 252 real plays, 252 twin answers, 10 five-bar rungs<\/span><\/div><div class=\"cell-head first\"><b>1 · a part&#x27;s metrics<\/b><span>0.00 s<\/span><\/div><p class=\"caption\">robot_msgs.metrics holds only signal math; the part&#x27;s catalog gives it meaning: an alias is a name, a signal, a display unit, how runs combine. The servo and the arm compile to one plan over one joint.<\/p><div class=\"stmt\"><pre class=\"code\"><span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">INTEGRATED_SERVO<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">())<\/span><\/pre><pre class=\"out\">integrated_servo.metrics (6 aliases)\n  tracking RMS         RootMeanSquare(rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0)      joint  [deg] across runs: median\n  tracking peak        MaxAbsolute(rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0)            joint  [deg] across runs: max\n  stop error p90 (T4)  StopStatistic(of=&#x27;error&#x27;, statistic=&#x27;p90&#x27;, band=inf, include_last_dwell=True, joint=0) joint  [deg] across runs: pooled:p90\n  overshoot            StopStatistic(of=&#x27;overshoot&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) joint  [deg] across runs: pooled:max\n  lag                  CrossCorrelationLag(max_offset_s=0.25)                         joint  [ms] across runs: median\n  limiter share        CodeShare(codes=(97, 98, 99, 102), channel=&#x27;fault&#x27;)            joint  [%] across runs: pooled:mean<\/pre><\/div><div class=\"stmt\"><pre class=\"code\"><span class=\"n\">INTEGRATED_SERVO<\/span><span class=\"o\">.<\/span><span class=\"n\">models<\/span><\/pre><pre class=\"out\">&lt;ModelFamily IntegratedServo · integrated_servo · 14 models: M0.ideal, M1.datasheet, M2.coulomb_viscous, M3.stribeck, M3.load, M3.lugre, M3.weakening_capture, M4.ripple, M4.drivetrain, M5.dcmotor, M5.envelope, M5.wear, M6.residual, M7.learned&gt;<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">arm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pendulum_arm<\/span><span class=\"p\">(<\/span><span class=\"n\">tip_length_m<\/span><span class=\"o\">=<\/span><span class=\"n\">TIPS<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"can11\"<\/span><span class=\"p\">])<\/span>    <span class=\"c1\"># CAN 11: the 339 mm heavy pendulum<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">())<\/span><\/pre><pre class=\"out\">1-DOF pendulum arm (tip 339 mm).metrics (12 aliases)\n  tracking RMS         RootMeanSquare(rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0)      joint  [deg] across runs: median\n  tracking peak        MaxAbsolute(rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0)            joint  [deg] across runs: max\n  stop error p90 (T4)  StopStatistic(of=&#x27;error&#x27;, statistic=&#x27;p90&#x27;, band=inf, include_last_dwell=True, joint=0) joint  [deg] across runs: pooled:p90\n  overshoot            StopStatistic(of=&#x27;overshoot&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) joint  [deg] across runs: pooled:max\n  lag                  CrossCorrelationLag(max_offset_s=0.25)                         joint  [ms] across runs: median\n  limiter share        CodeShare(codes=(97, 98, 99, 102), channel=&#x27;fault&#x27;)            joint  [%] across runs: pooled:mean\n  tip tracking RMS     RootMeanSquare(rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0)      joint  [mm] across runs: median\n  tip stop error       StopStatistic(of=&#x27;error&#x27;, statistic=&#x27;median&#x27;, band=inf, include_last_dwell=True, joint=0) joint  [mm] across runs: pooled:median\n  tip stop worst       StopStatistic(of=&#x27;error&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) joint  [mm] across runs: pooled:max\n  tip settle           StopStatistic(of=&#x27;settle&#x27;, statistic=&#x27;median&#x27;, band=0.0029498525073746312, include_last_dwell=True, joint=0) joint  [s] across runs: pooled:median\n  all stops settled    StopStatistic(of=&#x27;settled&#x27;, statistic=&#x27;all&#x27;, band=0.0029498525073746312, include_last_dwell=True, joint=0) joint  [-] across runs: pooled:all\n  stops                StopStatistic(of=&#x27;count&#x27;, statistic=&#x27;count&#x27;, band=inf, include_last_dwell=True, joint=0) joint  [-] across runs: pooled:count<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">RIGID_BODY_CHAIN<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">())<\/span><\/pre><pre class=\"out\">rigid_body_chain (bam_fb five-bar).metrics (4 aliases)\n  j2 tracking RMS    RootMeanSquare(rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0)         joints [deg] across runs: median\n  c1 tracking RMS    RootMeanSquare(rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=1)         joints [deg] across runs: median\n  tool tracking RMS  RootMeanSquare(rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0)         tool   [mm] across runs: median\n  tool worst         MaxAbsolute(rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0)            tool   [mm] across runs: max<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">Plan<\/span><span class=\"o\">.<\/span><span class=\"n\">compile<\/span><span class=\"p\">(<\/span><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">metrics<\/span><span class=\"p\">,<\/span> <span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">signals<\/span><span class=\"p\">)<\/span><\/pre><pre class=\"out\">Plan(12 aliases -&gt; 11 nodes, 5 computations incl. 1 stop pass)<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">aliases<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"n\">alias<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"n\">alias<\/span> <span class=\"k\">for<\/span> <span class=\"n\">alias<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">metrics<\/span><span class=\"p\">}<\/span>\n<span class=\"n\">aliases<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"tip stop error\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">card<\/span><span class=\"p\">()<\/span><\/pre><pre class=\"out\">{&#x27;name&#x27;: &#x27;tip stop error&#x27;,\n &#x27;unit&#x27;: &#x27;mm&#x27;,\n &#x27;signal&#x27;: &#x27;joint&#x27;,\n &#x27;target&#x27;: None,\n &#x27;across&#x27;: &#x27;pooled:median&#x27;,\n &#x27;function&#x27;: &#x27;robot_msgs.metrics.StopStatistic.functional&#x27;,\n &#x27;base&#x27;: &#x27;StopStatistic&#x27;,\n &#x27;config&#x27;: &quot;of=&#x27;error&#x27;, statistic=&#x27;median&#x27;, band=inf, include_last_dwell=True, joint=0&quot;,\n &#x27;description&#x27;: &#x27;A statistic over every stop of one quantity: |error| (last 50 ms), settle time, &#x27;\n                &#x27;overshoot.&#x27;,\n &#x27;references&#x27;: [&#x27;bam_rack_twin T4&#x27;, &#x27;MATLAB stepinfo&#x27;, &#x27;robot_msgs.compare.goal&#x27;,\n                &#x27;ISO 9283 pose accuracy&#x27;],\n &#x27;value_type&#x27;: &#x27;number&#x27;}<\/pre><\/div><div class=\"cell-head\"><b>2 · one recording, offline and live<\/b><span>0.25 s<\/span><\/div><p class=\"caption\">Live, the two topics arrive message by message and the aligner holds e 2.coulomb_viscous, M3.stribeck, M3.load, M3.lugre, M3.weakening_capture, M4.ripple, M4.drivetrain, M5.dcmotor, M5.envelope, M5.wear, M6.residual, M7.learned&gt;<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">arm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pendulum_arm<\/span><span class=\"p\">(<\/span><span class=\"n\">tip_length_m<\/span><span class=\"o\">=<\/span><span class=\"n\">TIPS<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"can11\"<\/span><span class=\"p\">])<\/span>    <span class=\"c1\"># CAN 11: the 339 mm heavy pendulum<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">table<\/span><span class=\"p\">())<\/span><\/pre><pre class=\"out\">1-DOF pendulum arm (tip 339 mm).metrics (12 aliases over 5 states)\n  tracking RMS         ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0)      [deg] live\n  tracking peak        ErrorStat(statistic=&#x27;max_abs&#x27;, rows=&#x27;all&#x27;, field=&#x27;positions&#x27;, joint=0)     [deg] live\n  stop error p90 (T4)  Dwell(of=&#x27;error&#x27;, statistic=&#x27;p90&#x27;, band=inf, include_last_dwell=True, joint=0) [deg] live\n  overshoot            Dwell(of=&#x27;overshoot&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) [deg] live\n  lag                  TimeOffset(max_offset_s=0.25)                                              [ms] end of run\n  limiter share        CodeShare(codes=(97, 98, 99, 102), channel=&#x27;fault&#x27;)                        [%] live\n  tip tracking RMS     ErrorStat(statistic=&#x27;rms&#x27;, rows=&#x27;moving&#x27;, field=&#x27;positions&#x27;, joint=0)      [mm] live\n  tip stop error       Dwell(of=&#x27;error&#x27;, statistic=&#x27;median&#x27;, band=inf, include_last_dwell=True, joint=0) [mm] live\n  tip stop worst       Dwell(of=&#x27;error&#x27;, statistic=&#x27;max&#x27; n class=\"p\">(<\/span><span class=\"n\">statistic<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"rms\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">rows<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"moving\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">rms_while_moving<\/span> <span class=\"o\">==<\/span> <span class=\"n\">aliases<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"tip tracking RMS\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">metric<\/span><\/pre><pre class=\"out\">True<\/pre><\/div><div class=\"stmt\"><pre class=\"code\"><span class=\"nb\">hash<\/span><span class=\"p\">(<\/span><span class=\"n\">rms_while_moving<\/span><span class=\"p\">)<\/span> <span class=\"o\">==<\/span> <span class=\"nb\">hash<\/span><span class=\"p\">(<\/span><span class=\"n\">aliases<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"tracking RMS\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">metric<\/span><span class=\"p\">)<\/span><\/pre><pre class=\"out\">True<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">aliases<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"tip stop error\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">card<\/span><span class=\"p\">()<\/span><\/pre><pre class=\"out\">{&#x27;name&#x27;: &#x27;tip stop error&#x27;,\n &#x27;unit&#x27;: &#x27;mm&#x27;,\n &#x27;signal&#x27;: &#x27;target/state&#x27;,\n &#x27;target&#x27;: None,\n &#x27;function&#x27;: &#x27;robot_metrics.Dwell.__call__&#x27;,\n &#x27;base&#x27;: &#x27;Dwell&#x27;,\n &#x27;config&#x27;: &quot;of=&#x27;error&#x27;, statistic=&#x27;median&#x27;, band=inf, include_last_dwell=True, joint=0&quot;,\n &#x27;description&#x27;: &#x27;A quantity of every stop (dwell &gt;= 0.25 s at zero commanded speed that a move led &#x27;\n                &#x27;into), pooled.&#x27;,\n &#x27;references&#x27;: [&#x27;bam_rack_twin T4&#x27; C } /* Name.Variable.Magic */\n.api-repl pre.code .il { color: #666 } /* Literal.Number.Integer.Long */\n<\/style><div class=\"api-repl\" style=\"--accent:#7a5bd1\"><div class=\"repl-head\"><b>round 8 · real runs · Part tree (RobotPart.metrics composes)<\/b><span>session on 252 real plays, 252 twin answers, 10 five-bar rungs<\/span><\/div><div class=\"cell-head first\"><b>1 · a part&#x27;s metrics<\/b><span>0.01 s<\/span><\/div><p class=\"caption\">The rack is a tree of RobotParts; each node lists aliases on ITS signal beside its models. The arm&#x27;s tip aliases name the servo child: the servo computes once, the arm shows it through its lever.<\/p><div class=\"stmt\"><pre class=\"code\"><span class=\"n\">tree<\/span> <span class=\"o\">=<\/span> <span class=\"n\">rack<\/span><span class=\"p\">(<\/span><span class=\"n\">TIPS<\/span><span class=\"p\">)<\/span>\n<span class=\"p\">[<\/span><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span> <span class=\"k\">for<\/span> <span class=\"n\">arm<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">tree<\/span><span class=\"o\">.<\/span><span class=\"n\">children<\/span><span class=\"p\">]<\/span><\/pre><pre class=\"out\">[&#x27;can1 arm&#x27;, &#x27;can11 arm&#x27;, &#x27;can12 arm&#x27;, &#x27;can13 arm&#x27;, &#x27;can14 arm&#x27;, &#x27;can15 arm&#x27;]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">arm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">tree<\/span><span class=\"o\">.<\/span><span class=\"n\">child<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"can11 arm\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">servo<\/span> <span class=\"o\">=<\/span> <span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">child<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"can11 servo\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">servo<\/span><span class=\"o\">.<\/span><span class=\"n\">models<\/span><\/pre><pre class=\"out\">&lt;ModelFamily IntegratedServo · integrated_servo · 14 models: M0.ideal, M1.datasheet, M2.coulomb_viscous, M3.stribeck, M3.load, M3.lugre, M3.weakening_capture, M4.ripple, M4.drivetrain, M5.dcmotor, M5.envelope, M5.wear, M6.residual, M7.learned&gt;<\/pre><\/div><div class=\"stmt\"><pre class=\"code\"><span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">metrics_table<\/span><span class=\"p\">(<\/span><span class=\"n\">servo<\/span><span class=\"p\">))<\/span><\/pre><pre class=\"out\">can11 servo: 6 aliases\n  tracking RMS         TrackingError(statistic=&#x27;rms&#x27;, field=&#x27;positions&#x27;, joint=0)     output [deg]\n  tracking peak        TrackingError(statistic=&#x27;max_abs&#x27;, field=&#x27;positions&#x27;, joint=0) output [deg]\n  stop error p90 (T4)  StopEvents(of=&#x27;error&#x27;, statistic=&#x27;p90&#x27;, band=inf, include_last_dwell=True, joint=0) output [deg]\n  overshoot            StopEvents(of=&#x27;overshoot&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) output [deg]\n  lag                  Lag(max_offset_s=0.25)                                         command [ms]\n  limiter share        CodeShare(codes=(97, 98, 99, 102), channel=&#x27;fault&#x27;)            output [%]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">models<\/span><span class=\"o\">.<\/span><span class=\"n\">type<\/span><\/pre><pre class=\"out\">&#x27;rigid_body_chain&#x27;<\/pre><\/div><div class=\"stmt\"><pre class=\"code\"><span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">context<\/span><\/pre><pre class=\"out\">{&#x27;lever_mm&#x27;: 339.0, &#x27;tip_length_m&#x27;: 0.339}<\/pre><\/div><div class=\"stmt\"><pre class=\"code\"><span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">metrics_table<\/span><span class=\"p\">(<\/span><span class=\"n\">arm<\/span><span class=\"p\">))<\/span><\/pre><pre class=\"out\">can11 arm: 6 aliases\n  tip tracking RMS     TrackingError(statistic=&#x27;rms&#x27;, field=&#x27;positions&#x27;, joint=0)     child can11 servo output [mm]\n  tip stop error       StopEvents(of=&#x27;error&#x27;, statistic=&#x27;median&#x27;, band=inf, include_last_dwell=True, joint=0) child can11 servo output [mm]\n  tip stop worst       StopEvents(of=&#x27;error&#x27;, statistic=&#x27;max&#x27;, band=inf, include_last_dwell=True, joint=0) child can11 servo output [mm]\n  tip settle           StopEvents(of=&#x27;settle&#x27;, statistic=&#x27;median&#x27;, band=0.0029498525073746312, include_last_dwell=True, joint=0) child can11 servo output [s]\n  all stops settled    StopEvents(of=&#x27;settled&#x27;, statistic=&#x27;all&#x27;, band=0.0029498525073746312, include_last_dwell=True, joint=0) child can11 servo output [-]\n  stops                StopEvents(of=&#x27;count&#x27;, statistic=&#x27;count&#x27;, band=inf, include_last_dwell=True, joint=0) child can11 servo output [-]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">FIVE_BAR<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span><\/pre><pre class=\"out\">&#x27;bam_fb five-bar&#x27;<\/pre><\/div><div class=\"stmt\"><pre class=\"code\"><span class=\"p\">[<\/span><span class=\"n\">child<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span> <span class=\"k\">for<\/span> <span class=\"n\">child<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">FIVE_BAR<\/span><span class=\"o\">.<\/span><span class=\"n\">children<\/span><span class=\"p\">]<\/span><\/pre><pre class=\"out\">[&#x27;j2 servo&#x27;, &#x27;c1 servo&#x27;]<\/pre><\/div><div class=\"stmt\"><pre class=\"code\"><span class=\"p\">[<\/span><span class=\"n\">alias<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span> <span class=\"k\">for<\/span> <span class=\"n\">alias<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">FIVE_BAR<\/span><span class=\"o\">.<\/span><span class=\"n\">metrics<\/span><span class=\"p\">]<\/span><\/pre><pre class=\"out\">[&#x27;tool tracking RMS&#x27;, &#x27;tool worst&#x27;]<\/pre><\/div><div class=\"stmt gap\"><pre class=\"code\"><span class=\"n\">aliases<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"n\">alias<\/span><span class=\"o\">.<\/span><span class=\"n\">name<\/span><span class=\"p\">:<\/span> <span class=\"n\">alias<\/span> <span class=\"k\">for<\/span> <span class=\"n\">alias<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">arm<\/span><span class=\"o\">.<\/span><span class=\"n\">metrics<\/span><span class=\"p\">}<\/span>\n<span class=\"n\">aliases<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"tip stop error\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">card<\/span><span class=\"p\">()<\/span><\/pre><pre class=\"out\">{&#x27;name&#x27;: &#x27;tip stop error&#x27;,\n &#x27;unit&#x27;: &#x27;mm&#x27;,\n &#x27;signal&#x27;: &#x27;can11 servo/output&#x27;,\n &#x27;target&#x27;: None,\n &#x27;function&#x27;: &#x27;robotparts.metrics.StopEvents.compute&#x27;,\n &#x27;base&#x27;: &#x27;StopEvents&#x27;,\n &#x27;config&#x27;: &quot;of=&#x27;error&#x27;, statistic=&#x27;median&#x27;, band=inf, include_last_dwell=True, joint=0&quot;,\n &#x27;description&#x27;: &#x27;A quantity of every stop event (a dwell &gt;= 0.25 s at zero commanded speed a move &#x27;\n                &#x27;led into).&#x27;,\n &#x27;references&#x27;: [&#x27;bam_rack_twin T4&#x27;, &#x27;MATLAB stepinfo&#x27;, &#x27;robot_msgs.compare.goal&#x27;],\n &#x27;value_type&#x27;: &#x27;number&#x27;,\n &#x27;input&#x27;: &#x27;Events&#x27;,\n &#x27;live&#x27;: True}<\/pre><\/div><div class=\"cell-head\"><b>2 · one recording, offline and live<\/b><span>0.05 s<\/span><\/div><p class=\"caption\">Live, the arm subtree takes 7-row chunks; each node&#x27;s segmenter carries the open move or dwell across chunk boundaries; events are what the drill-down op
